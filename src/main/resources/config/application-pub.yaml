server:
  # 停止时先拒绝新请求、等在途请求跑完，滚动发布不再掐断连接
  shutdown: graceful
  tomcat:
    connection-timeout: 20s
    keep-alive-timeout: 20s
    max-keep-alive-requests: 100
    # 比上传上限略大，超限时 Tomcat 才肯把请求体读完，客户端收得到 413；不想读设 -1
    max-swallow-size: 25MB

spring:
  lifecycle:
    # 优雅停机的等待上限，超过则强制关闭
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 30s
  servlet:
    multipart:
      # 默认 1MB，业务一传文件就超限
      max-file-size: 20MB
      max-request-size: 20MB
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://129.204.226.206:5432/wechat?currentSchema=public&ApplicationName=SpringVortexDemo&reWriteBatchedInserts=true}
    username: ${DB_USERNAME:wechat}
    password: ${DB_PASSWORD:F6ReRSkRBiETWD2w}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VortexHikari
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000
      minimum-idle: 5
      maximum-pool-size: 20

  # 迁移脚本：db/ddl 放结构变更，db/dml 放初始化数据
  flyway:
    # 非空库首次接入 Flyway 时把现状记为基线，不重跑历史脚本；空库会照常执行全部迁移
    baseline-on-migrate: true
    # 当前库里 sys_user 已存在，基线记为 20261010.1，跳过建表脚本只跑之后的迁移
    # 必须加引号：不加会被 YAML 当成小数，Flyway 收到 2.02610101E7 直接报错
    baseline-version: "20261010.1"
    locations: classpath:db/ddl,classpath:db/dml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # 粒度要与 @MapperScan 的 **.mapper 对齐，否则 XML 里的短类名解析失败
  type-aliases-package: com.zjc.demo.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

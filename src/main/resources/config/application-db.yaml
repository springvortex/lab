spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://129.204.226.206:5432/wechat?currentSchema=public&ApplicationName=SpringVortexDemo&reWriteBatchedInserts=true}
    username: ${DB_USERNAME:wechat}
    password: ${DB_PASSWORD:myS3LXKyR7zLiFH8}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VortexHikari
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000
      minimum-idle: 5
      maximum-pool-size: 20

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # 粒度要与 @MapperScan 的 **.mapper 对齐，否则 XML 里的短类名解析失败
  type-aliases-package: com.zjc.demo.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

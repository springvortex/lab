# ============================================================================
# i18n messages - English
#
# Key set must stay identical to messages.properties. Missing keys silently fall
# back to the base file (see I18nConfig#messageSource), which is Chinese - the
# request would still succeed but return the wrong language.
#
# MessageUtilsTest#allBundlesShareSameKeys guards this.
# ============================================================================

# --- Response: generic ------------------------------------------------------
response.success=Success
response.failure=Operation failed
response.param-invalid=Invalid parameters
response.bad-request=Malformed request body
response.not-found=Resource not found
response.conflict=Data conflict
response.method-not-allowed={0} method is not supported
response.unsupported-media-type=Unsupported request content type
response.request-timeout=Request timed out
response.unauthorized=Unauthenticated
response.forbidden=Forbidden
response.internal-error=Internal server error
response.service-unavailable=Service unavailable
response.not-acceptable=Unable to produce the requested response media type

# --- Request parameters -----------------------------------------------------
request.missing-parameter=Missing required parameter: {0}

# --- Developer-time errors (never returned to callers) ----------------------
# These never reach an HTTP response body: they are thrown while constructing
# objects or from framework callbacks, i.e. they only surface if the code is
# wrong. They live here so that every human-facing string has exactly one home.
error.utility-class-instantiation=Utility class must not be instantiated
error.constant-class-instantiation=Constant class must not be instantiated

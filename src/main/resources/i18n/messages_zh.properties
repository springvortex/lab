# ============================================================================
# 国际化文案 —— 简体中文（默认语言）
#
# 与 messages.properties 保持完全一致的 key 集合。两者内容相同是刻意的：
# 基名文件是所有语言的最终兜底，中文又是默认语言，所以它俩必须都是完整的一份。
# ============================================================================

# --- 响应：通用 -------------------------------------------------------------
response.success=操作成功
response.failure=操作失败
response.param-invalid=参数非法
response.bad-request=请求体格式错误
response.not-found=资源不存在
response.conflict=数据冲突
response.method-not-allowed={0} 方法不支持
response.unsupported-media-type=不支持的请求体类型
response.request-timeout=请求处理超时
response.unauthorized=未认证
response.forbidden=无权限
response.internal-error=服务内部错误
response.service-unavailable=服务不可用
response.not-acceptable=无法产出客户端要求的响应类型

# --- 请求参数 ---------------------------------------------------------------
request.missing-parameter=缺少必填参数: {0}

# --- 开发期错误（不面向调用方）------------------------------------------------
# 这些文案不会出现在 HTTP 响应体里：抛异常的位置在对象构造期或框架回调期，
# 属于「写错了才看得到」的开发者提示。之所以也放进资源文件，是为了让所有
# 面向人的字符串只有一处出处，避免同义文案在代码里散落好几份。
error.utility-class-instantiation=工具类禁止实例化
error.constant-class-instantiation=常量类禁止实例化
